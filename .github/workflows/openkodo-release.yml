name: OpenKodo release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            pattern: dist/*.exe
          - os: ubuntu-latest
            target: --linux tar.gz
            pattern: dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install mobile dependencies
        run: pnpm -C mobile install --frozen-lockfile
      - name: Build JavaScript, CLI and web clients
        run: pnpm build:release:javascript
      - name: Ensure Electron runtime
        run: pnpm run ensure:electron-runtime
      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.target }} --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkodo-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
