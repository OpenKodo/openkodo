name: OpenKodo attach release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run whose artifacts to attach
        required: true
      tag:
        description: Release tag to attach them to
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" -D artifacts
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          printf 'Attaching %s file(s)\n' "${#files[@]}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
